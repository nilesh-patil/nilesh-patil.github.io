# Build the Jekyll site, run Pagefind over the output, and deploy to GitHub Pages.
# Replaces the default `pages-build-deployment` job so we can append Pagefind.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      # Installs the exact Pagefind version recorded in package-lock.json.
      - name: Install Node dependencies
        run: npm ci --no-fund --no-audit

      - uses: ruby/setup-ruby@v1 # mutable tag: prior SHA pin was an old version that maxes at Ruby 3.1; @v1 is the conventional usage and tracks current Ruby support
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site (Jekyll)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Build search index (Pagefind)
        run: npx pagefind --site _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
